category: Analytics & SIEM
commonfields:
  id: CriblSearch
  version: -1
configuration:
- defaultvalue: https://main-<org>.cribl.cloud/api/v2/m/default_search
  display: Server URL
  name: url
  required: true
  type: 0
  additionalinfo: >-
    Base URL for the Cribl Search API, including the API version and search context path,
    e.g. https://main-<org>.cribl.cloud/api/v2/m/default_search. Cribl Search is only
    available on the v2 API.
- display: Client ID
  displaypassword: Client Secret
  name: credentials
  required: true
  type: 9
  additionalinfo: >-
    OAuth2 client credentials for Cribl.Cloud. Create a client under
    Settings > Global Settings > API Authentication in your Cribl.Cloud organization
- defaultvalue: https://login.cribl.cloud/oauth/token
  display: Token URL
  name: token_url
  required: false
  type: 0
  additionalinfo: >-
    OAuth2 token endpoint. Defaults to the Cribl.Cloud endpoint. Override only for
    on-premises deployments with a custom identity provider.
- display: Trust any certificate (not secure)
  name: insecure
  required: false
  type: 8
  defaultvalue: 'false'
- display: Use system proxy settings
  name: proxy
  required: false
  type: 8
  defaultvalue: 'false'
description: Run and manage Cribl Search jobs, saved searches, datasets, dataset providers, macros, and datatypes. Search Cribl Lake and federated data sources directly from playbooks.
display: Cribl Search
name: CriblSearch
script:
  commands:
  - name: Cribl-search-list-jobs
    description: List search jobs, with optional filtering and pagination.
    arguments:
    - name: output
      description: Response format. Use "short" to return abbreviated job information.
      required: false
      predefined:
      - short
    - name: ids
      description: Comma-separated list of job IDs to filter by.
      required: false
      isArray: true
    - name: type
      description: Filter by job type.
      required: false
      predefined:
      - standard
      - datatypePreview
      - scheduled
      - dashboard
      - command
      - notebook
      - systemInsights
      - agentic
      - metrics
    - name: earliest
      description: Filter jobs by earliest time (relative string such as -24h, or epoch seconds).
      required: false
    - name: latest
      description: Filter jobs by latest time. Used when output=short.
      required: false
    - name: filter_exp
      description: Filter expression evaluated against jobs for inclusion in the response.
      required: false
    - name: sort_exp
      description: Sorting expression evaluated against jobs to specify the sort order.
      required: false
    - name: sort_dir
      description: Sort direction.
      required: false
      predefined:
      - asc
      - desc
    - name: limit
      description: Maximum number of jobs to return.
      required: false
    - name: offset
      description: Starting offset for pagination. Use with limit.
      required: false
    outputs:
    - contextPath: CriblSearch.Job.id
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.Job.status
      description: Lifecycle status of the job (new, queued, running, completed, failed, canceled).
      type: String
    - contextPath: CriblSearch.Job.query
      description: Query text submitted for the job.
      type: String
    - contextPath: CriblSearch.Job.user
      description: Authenticated principal that created the job.
      type: String
    - contextPath: CriblSearch.Job.timeCreated
      description: Job creation time in Unix epoch milliseconds.
      type: Number
    - contextPath: CriblSearch.Job.timeCompleted
      description: Time the job reached a terminal state, in Unix epoch milliseconds.
      type: Number
  - name: Cribl-search-get-job
    description: Get a single search job by ID.
    arguments:
    - name: id
      description: The ID of the search job.
      required: true
    outputs:
    - contextPath: CriblSearch.Job.id
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.Job.status
      description: Lifecycle status of the job.
      type: String
    - contextPath: CriblSearch.Job.query
      description: Query text submitted for the job.
      type: String
    - contextPath: CriblSearch.Job.earliest
      description: Lower bound of the search time window.
      type: String
    - contextPath: CriblSearch.Job.latest
      description: Upper bound of the search time window.
      type: String
    - contextPath: CriblSearch.Job.timeCreated
      description: Job creation time in Unix epoch milliseconds.
      type: Number
    - contextPath: CriblSearch.Job.timeCompleted
      description: Time the job reached a terminal state, in Unix epoch milliseconds.
      type: Number
    - contextPath: CriblSearch.Job.totalEventCount
      description: Total result events for a completed job.
      type: Number
  - name: Cribl-search-create-job
    description: Create (run) a search job. To search Cribl Lake, reference a Lake dataset in the query, e.g. dataset="my_lake_dataset" | limit 1000.
    arguments:
    - name: query
      description: The query to execute.
      required: true
    - name: earliest
      description: Earliest time in the query time range (relative string such as -15m, or epoch seconds).
      required: false
    - name: latest
      description: Latest time in the query time range (relative string such as now, or epoch seconds).
      required: false
    - name: sample_rate
      description: Sampling rate between 0 and 1 used to pick events early in the pipeline.
      required: false
    - name: timezone
      description: IANA timezone identifier (for example America/New_York, UTC) used for the search.
      required: false
    - name: is_private
      description: Whether job results are accessible only to the owner.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: num_events_before
      description: Number of events to retrieve before the target event, in contextual-event mode.
      required: false
    - name: num_events_after
      description: Number of events to retrieve after the target event, in contextual-event mode.
      required: false
    - name: target_event_time
      description: Anchor event time (Unix epoch milliseconds) for contextual before/after retrieval.
      required: false
    - name: set_options
      description: JSON object of SET option names to string or numeric values controlling query execution.
      required: false
    - name: expected_output_type
      description: Output type expected from a System Insights query.
      required: false
    outputs:
    - contextPath: CriblSearch.Job.id
      description: Unique identifier of the created search job.
      type: String
    - contextPath: CriblSearch.Job.status
      description: Lifecycle status of the job.
      type: String
    - contextPath: CriblSearch.Job.query
      description: Query text submitted for the job.
      type: String
    - contextPath: CriblSearch.Job.earliest
      description: Lower bound of the search time window.
      type: String
    - contextPath: CriblSearch.Job.latest
      description: Upper bound of the search time window.
      type: String
    - contextPath: CriblSearch.Job.timeCreated
      description: Job creation time in Unix epoch milliseconds.
      type: Number
  - name: Cribl-search-update-job
    description: Update a search job. Supports transitioning the job to completed or canceled and toggling result privacy.
    arguments:
    - name: id
      description: The ID of the search job to update.
      required: true
    - name: status
      description: The new status for the job.
      required: false
      predefined:
      - completed
      - canceled
    - name: is_private
      description: Whether job results are accessible only to the owner.
      required: false
      predefined:
      - 'true'
      - 'false'
    outputs:
    - contextPath: CriblSearch.Job.id
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.Job.status
      description: Lifecycle status of the job.
      type: String
    - contextPath: CriblSearch.Job.isPrivate
      description: Whether job results are restricted to the owner.
      type: Boolean
  - name: Cribl-search-delete-job
    description: Delete a search job.
    execution: true
    arguments:
    - name: id
      description: The ID of the search job to delete.
      required: true
    outputs: []
  - name: Cribl-search-cancel-job
    description: Cancel a running search job.
    execution: true
    arguments:
    - name: id
      description: The ID of the search job to cancel.
      required: true
    outputs:
    - contextPath: CriblSearch.Job.id
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.Job.status
      description: Lifecycle status of the job after the cancel request.
      type: String
    - contextPath: CriblSearch.Job.timeCompleted
      description: Time the job reached a terminal state, in Unix epoch milliseconds.
      type: Number
  - name: Cribl-search-get-job-status
    description: Get execution status and progress counters for a search job.
    arguments:
    - name: id
      description: The ID of the search job.
      required: true
    - name: advanced
      description: If true, include stage-level details, ingestion metrics, and object filter statistics.
      required: false
      predefined:
      - 'true'
      - 'false'
    outputs:
    - contextPath: CriblSearch.JobStatus.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobStatus.status
      description: Current lifecycle status of the search job.
      type: String
    - contextPath: CriblSearch.JobStatus.eventsFound
      description: Number of events that matched the query.
      type: Number
    - contextPath: CriblSearch.JobStatus.objectsSearched
      description: Number of objects fully searched so far.
      type: Number
    - contextPath: CriblSearch.JobStatus.objectsFound
      description: Number of objects discovered for the search to read.
      type: Number
    - contextPath: CriblSearch.JobStatus.bytesIn
      description: Number of bytes scanned while executing the query.
      type: Number
    - contextPath: CriblSearch.JobStatus.timeStarted
      description: Timestamp when the job began executing, in Unix epoch milliseconds.
      type: Number
    - contextPath: CriblSearch.JobStatus.timeCompleted
      description: Timestamp when the job finished or was cancelled, in Unix epoch milliseconds.
      type: Number
  - name: Cribl-search-get-job-results
    description: Retrieve a page of search job results. Results are returned as a list of event objects under CriblSearch.SearchResult.events.
    arguments:
    - name: id
      description: The ID of the search job to get results for.
      required: true
    - name: limit
      description: Maximum number of events to return.
      required: false
    - name: offset
      description: Starting offset of the events.
      required: false
    - name: lower_bound
      description: Lower bound of the time range, inclusive (epoch seconds).
      required: false
    - name: upper_bound
      description: Upper bound of the time range, exclusive (epoch seconds).
      required: false
    outputs:
    - contextPath: CriblSearch.SearchResult.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.SearchResult.isFinished
      description: Whether all result pages have been produced for the job.
      type: Boolean
    - contextPath: CriblSearch.SearchResult.totalEventCount
      description: Total number of events that matched the query.
      type: Number
    - contextPath: CriblSearch.SearchResult.persistedEventCount
      description: Number of events persisted for the search job.
      type: Number
    - contextPath: CriblSearch.SearchResult.offset
      description: Offset value from the request that produced the page.
      type: Number
    - contextPath: CriblSearch.SearchResult.limit
      description: Limit value from the request that produced the page.
      type: Number
    - contextPath: CriblSearch.SearchResult.events
      description: The result event objects for this page.
      type: Unknown
  - name: Cribl-search-get-job-results-poll
    description: Retrieve search job results, returning immediately when the job status changes. Behaves like Cribl-search-get-job-results with an extra last_job_status hint.
    arguments:
    - name: id
      description: The ID of the search job to poll results for.
      required: true
    - name: limit
      description: Maximum number of events to return.
      required: false
    - name: offset
      description: Starting offset of the events.
      required: false
    - name: lower_bound
      description: Lower bound of the time range, inclusive (epoch seconds).
      required: false
    - name: upper_bound
      description: Upper bound of the time range, exclusive (epoch seconds).
      required: false
    - name: last_job_status
      description: Last known status of the search job. The call returns immediately when the status changes from this value.
      required: false
    outputs:
    - contextPath: CriblSearch.SearchResult.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.SearchResult.isFinished
      description: Whether all result pages have been produced for the job.
      type: Boolean
    - contextPath: CriblSearch.SearchResult.totalEventCount
      description: Total number of events that matched the query.
      type: Number
    - contextPath: CriblSearch.SearchResult.persistedEventCount
      description: Number of events persisted for the search job.
      type: Number
    - contextPath: CriblSearch.SearchResult.events
      description: The result event objects for this page.
      type: Unknown
  - name: Cribl-search-get-job-metrics
    description: Get the full metrics object for a search job (executor, trace, object, and other metrics).
    arguments:
    - name: id
      description: The ID of the search job to get metrics for.
      required: true
    outputs:
    - contextPath: CriblSearch.JobMetrics.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobMetrics.metrics
      description: The full metrics object for the search job.
      type: Unknown
  - name: Cribl-search-get-job-timeline
    description: Get the per-bucket event count timeline for a search job.
    arguments:
    - name: id
      description: The ID of the search job to get the timeline for.
      required: true
    outputs:
    - contextPath: CriblSearch.JobTimeline.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobTimeline.totalEventCount
      description: Total number of events across all buckets.
      type: Number
    - contextPath: CriblSearch.JobTimeline.buckets
      description: Event counts per time bucket.
      type: Unknown
  - name: Cribl-search-get-job-field-summaries
    description: Get field statistics and top values for each field in a search job.
    arguments:
    - name: id
      description: The ID of the search job to get field summaries for.
      required: true
    - name: limit
      description: Maximum number of fields to return.
      required: false
    - name: offset
      description: Pagination offset.
      required: false
    outputs:
    - contextPath: CriblSearch.JobFieldSummary.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobFieldSummary.totalEventCount
      description: Total number of events considered for the summary.
      type: Number
    - contextPath: CriblSearch.JobFieldSummary.partial
      description: Whether one or more fields were omitted due to field summary limits.
      type: Boolean
    - contextPath: CriblSearch.JobFieldSummary.fields
      description: Field statistics and top values for each field.
      type: Unknown
  - name: Cribl-search-list-job-logs
    description: List the log filenames available for a search job.
    arguments:
    - name: id
      description: The ID of the search job to list log files for.
      required: true
    - name: limit
      description: Maximum number of items to return.
      required: false
    - name: offset
      description: Pagination offset.
      required: false
    outputs:
    - contextPath: CriblSearch.JobLog.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobLog.logFiles
      description: Available log filenames for the search job.
      type: Unknown
  - name: Cribl-search-get-job-settings
    description: Get retention settings for a search job.
    arguments:
    - name: id
      description: The ID of the search job to get settings for.
      required: true
    outputs:
    - contextPath: CriblSearch.JobSettings.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobSettings.reaperKeepUntil
      description: Timestamp (Unix milliseconds) until which the job must be retained.
      type: Number
  - name: Cribl-search-update-job-settings
    description: Update retention settings for a search job.
    arguments:
    - name: id
      description: The ID of the search job to update settings for.
      required: true
    - name: reaper_keep_until
      description: Timestamp (Unix milliseconds) until which the job must be retained.
      required: false
    outputs:
    - contextPath: CriblSearch.JobSettings.jobId
      description: Unique identifier of the search job.
      type: String
    - contextPath: CriblSearch.JobSettings.reaperKeepUntil
      description: Timestamp (Unix milliseconds) until which the job must be retained.
      type: Number
  - name: Cribl-search-list-saved-searches
    description: List saved searches, with optional pagination.
    arguments:
    - name: limit
      description: Maximum number of saved searches to return.
      required: false
    - name: offset
      description: Starting offset for pagination. Use with limit.
      required: false
    - name: output
      description: Pass "short" to receive a compact list-view response.
      required: false
      predefined:
      - short
    - name: resolve_datasets
      description: If true, include resolved dataset identifiers on each saved search.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: dataset_ids
      description: Return only saved searches associated with any of the listed dataset IDs (maximum 10).
      required: false
      isArray: true
    outputs:
    - contextPath: CriblSearch.SavedSearch.id
      description: Unique identifier of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.name
      description: Display name of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.description
      description: Description of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.query
      description: Query text of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.user
      description: Identifier of the user who created the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.isPrivate
      description: Whether job results are restricted to the owner.
      type: Boolean
  - name: Cribl-search-get-saved-search
    description: Get a single saved search by ID.
    arguments:
    - name: id
      description: The ID of the saved search.
      required: true
    outputs:
    - contextPath: CriblSearch.SavedSearch.id
      description: Unique identifier of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.name
      description: Display name of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.query
      description: Query text of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.earliest
      description: Start of the search time range.
      type: String
    - contextPath: CriblSearch.SavedSearch.latest
      description: End of the search time range.
      type: String
  - name: Cribl-search-create-saved-search
    description: Create a saved search.
    arguments:
    - name: id
      description: Unique identifier for the saved search.
      required: true
    - name: name
      description: Display name for the saved search.
      required: true
    - name: query
      description: Query text for the saved search.
      required: true
    - name: description
      description: Brief description of the saved search.
      required: false
    - name: earliest
      description: Start of the search time range (relative string or absolute time).
      required: false
    - name: latest
      description: End of the search time range (relative string or absolute time).
      required: false
    - name: sample_rate
      description: Sampling rate applied to events, between 0 and 1.
      required: false
    - name: timezone
      description: IANA timezone for scheduled execution.
      required: false
    - name: is_private
      description: If true, job results are restricted to the owner.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: schedule
      description: JSON object with the cron schedule and notification settings for a scheduled saved search.
      required: false
    - name: body
      description: JSON object with additional saved search fields. Merged with the explicit arguments (explicit arguments win).
      required: false
    outputs:
    - contextPath: CriblSearch.SavedSearch.id
      description: Unique identifier of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.name
      description: Display name of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.query
      description: Query text of the saved search.
      type: String
  - name: Cribl-search-update-saved-search
    description: Update a saved search.
    arguments:
    - name: id
      description: The ID of the saved search to update.
      required: true
    - name: name
      description: Display name for the saved search.
      required: false
    - name: query
      description: Query text for the saved search.
      required: false
    - name: description
      description: Brief description of the saved search.
      required: false
    - name: earliest
      description: Start of the search time range.
      required: false
    - name: latest
      description: End of the search time range.
      required: false
    - name: sample_rate
      description: Sampling rate applied to events, between 0 and 1.
      required: false
    - name: timezone
      description: IANA timezone for scheduled execution.
      required: false
    - name: is_private
      description: If true, job results are restricted to the owner.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: schedule
      description: JSON object with the cron schedule and notification settings.
      required: false
    - name: body
      description: JSON object with additional saved search fields. Merged with the explicit arguments (explicit arguments win).
      required: false
    outputs:
    - contextPath: CriblSearch.SavedSearch.id
      description: Unique identifier of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.name
      description: Display name of the saved search.
      type: String
    - contextPath: CriblSearch.SavedSearch.query
      description: Query text of the saved search.
      type: String
  - name: Cribl-search-delete-saved-search
    description: Delete a saved search.
    execution: true
    arguments:
    - name: id
      description: The ID of the saved search to delete.
      required: true
    outputs: []
  - name: Cribl-search-list-datasets
    description: List datasets available to Cribl Search, including Cribl Lake datasets and federated data sources.
    arguments:
    - name: limit
      description: Maximum number of datasets to return.
      required: false
    - name: offset
      description: Starting offset for pagination. Use with limit.
      required: false
    - name: explorer_stats
      description: If true, include 30-day search counts and, for supported local datasets, event counts.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: last_used
      description: If true, include the last-used timestamp from query history for each dataset.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: favorites
      description: If true, include favorite records for each dataset.
      required: false
      predefined:
      - 'true'
      - 'false'
    - name: vtables
      description: If true, include virtual table definitions as additional dataset entries.
      required: false
      predefined:
      - 'true'
      - 'false'
    outputs:
    - contextPath: CriblSearch.Dataset.id
      description: Unique identifier of the dataset.
      type: String
    - contextPath: CriblSearch.Dataset.type
      description: Dataset type identifier.
      type: String
    - contextPath: CriblSearch.Dataset.description
      description: Description of the dataset.
      type: String
  - name: Cribl-search-get-dataset
    description: Get a single dataset by ID.
    arguments:
    - name: id
      description: The ID of the dataset.
      required: true
    outputs:
    - contextPath: CriblSearch.Dataset.id
      description: Unique identifier of the dataset.
      type: String
    - contextPath: CriblSearch.Dataset.type
      description: Dataset type identifier.
      type: String
    - contextPath: CriblSearch.Dataset.description
      description: Description of the dataset.
      type: String
  - name: Cribl-search-create-dataset
    description: Create a dataset. Dataset bodies are polymorphic and depend on the dataset type; supply the full definition as JSON.
    arguments:
    - name: body
      description: JSON object with the full dataset definition (must include the type field and type-specific configuration).
      required: true
    outputs:
    - contextPath: CriblSearch.Dataset.id
      description: Unique identifier of the created dataset.
      type: String
    - contextPath: CriblSearch.Dataset.type
      description: Dataset type identifier.
      type: String
  - name: Cribl-search-update-dataset
    description: Update a dataset. Supply the full updated definition as JSON.
    arguments:
    - name: id
      description: The ID of the dataset to update.
      required: true
    - name: body
      description: JSON object with the full updated dataset definition.
      required: true
    outputs:
    - contextPath: CriblSearch.Dataset.id
      description: Unique identifier of the dataset.
      type: String
    - contextPath: CriblSearch.Dataset.type
      description: Dataset type identifier.
      type: String
  - name: Cribl-search-delete-dataset
    description: Delete a dataset.
    execution: true
    arguments:
    - name: id
      description: The ID of the dataset to delete.
      required: true
    outputs: []
  - name: Cribl-search-delete-dataset-data
    description: Remove all ingested events from a Cribl Search dataset. This permanently deletes data.
    execution: true
    arguments:
    - name: id
      description: The ID of the Cribl Search dataset to remove ingested events from.
      required: true
    outputs: []
  - name: Cribl-search-get-dataset-fields
    description: Get lakehouse-engine dataset field names over a time window. Defaults to the last 24 hours with 1-hour buckets.
    arguments:
    - name: id
      description: The ID of the dataset to get field names for.
      required: true
    - name: start_time
      description: Window start time (relative string such as -24h, ISO 8601, or epoch). Defaults to 24 hours ago.
      required: false
    - name: end_time
      description: Window end time. Defaults to now.
      required: false
    - name: granularity
      description: Bucket width for the time series, in milliseconds. Defaults to 3600000 (1 hour).
      required: false
    - name: top_values
      description: If true, also return each field's most frequent values.
      required: false
      predefined:
      - 'true'
      - 'false'
    outputs:
