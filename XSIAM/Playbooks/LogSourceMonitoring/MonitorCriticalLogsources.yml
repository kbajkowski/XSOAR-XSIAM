      name: Load Log Source Details into Context (From Lookup)
      description: |-
        Execute an XQL query and retrieve results of an executed XQL query API. The command will be executed every 10 seconds until results are retrieved or until a timeout error is raised.
        When more than 1000 results are retrieved, the command will return a compressed gzipped JSON format file,
        unless the argument 'parse_result_file_to_context' is set to true and then the results will be extracted to the context.
      script: XQL Query Engine|||xdr-xql-generic-query
      type: regular
      iscommand: true
      brand: XQL Query Engine
      playbooktaskmissingcomponent: null
      istaskmissingcomponenterrordismissed: false
    nexttasks:
      '#error#':
      - "28"
      '#none#':
      - "42"
    scriptarguments:
      extend-context:
        simple: FailedLogSourceDetails=results
      interval_in_seconds:
        simple: "15"
      parse_result_file_to_context:
        simple: "false"
      query:
        simple: dataset = critical_logsources | filter logsourcename = "${issue.logsource}"
          and alertsource = "${issue.detectionsource}"
      query_name:
        simple: Cribl Log Source Monitoring - Lookup Dataset
      retry-count:
        simple: "5"
      retry-interval:
        simple: "120"
      timeout_in_seconds:
        simple: "600"
