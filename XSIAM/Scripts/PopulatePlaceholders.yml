args:
- description: 'A JSON dictionary where the values contain ${variables} that need
    to be replaced with actual data. Use this to format multiple templates at the
    same time (e.g., pulling a dictionary containing both an email subject and body
    from an XSIAM List). Note: Leave this blank if you are using inputString instead.
    Example: {"email_subject": "Alert ${id}", "email_body": "User ${name} triggered
    an alert."}'
  name: inputDict
  supportedModules: []
- description: 'The root context key where the final, formatted results will be saved
    in the investigation. If using inputDict, the dictionary keys will be appended
    to this root key (e.g., if the key is VIP_Output, results are saved to VIP_Output.email_subject).  Default
    Value: ReplaceVariables (or whatever you decided to name the script)'
  name: key
  required: true
  supportedModules: []
- description: '(Optional) A JSON object or context dictionary containing the raw
    data you want to use as an "answer key." If provided, the script will search this
    specific object to find the values for your ${variables}. If left blank, or if
    a variable isn''t found here, the script will automatically fall back to searching
    the standard incident/alert context.  Example: ${ActiveDirectory.User}'
  name: matchObject
  supportedModules: []
- description: 'A single text string containing ${variables} that you want to replace
    with actual data. Use this if you only need to format one simple message rather
    than a bulk dictionary. Note: Leave this blank if you are using inputDict.  Example:
    The server ${endpoint.hostname} in ${region} is offline.'
  name: inputString
  supportedModules: []
- auto: PREDEFINED
  defaultValue: "no"
  description: When set to "yes", placeholders are resolved ONLY from the matchObject
    argument. Incident/alert fields, labels and general context are not consulted,
    and placeholders not found in matchObject are always left intact (removeNotFound
    does not apply to them). Use this to guarantee a render only touches the variables
    you explicitly provide.
  name: matchOnly
  predefined:
  - "yes"
  - "no"
  supportedModules: []
- auto: PREDEFINED
  default: true
  defaultValue: "no"
  description: Determines what happens if the script cannot find any data to replace
    a specific ${variable}. Select 'yes' to cleanly delete the unresolved placeholder
    from the final text. Select 'no' to leave the literal ${variable} text in the
    output so you can clearly see what failed to populate.
  name: removeNotFound
  predefined:
  - "yes"
  - "no"
  supportedModules: []
comment: |-
  This script is used to populate placeholders within a string. For example:

  String: "Hello my name is ${name}"
  ContextData: {"name":"Kris"}

  The script will attempt to find the context key called "name" and place its value into the string, resulting in:

  Final Output: "Hello my name is Kris"
