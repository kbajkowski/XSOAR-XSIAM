args:
- default: true
  description: The parent key to which we append all the other keys.
  name: parent
  required: true
  supportedModules: []
- description: Separated list of keys separated by the specified delimiter (Comma
    is the default delimiter).
  name: keys
  required: true
  supportedModules: []
- description: Separated list of values separated by the specified delimiter (Comma
    is the default delimiter).
  name: values
  required: true
  supportedModules: []
- defaultValue: ','
  description: |-
    Delimiter by which the content of the values and keys lists are separated.
    Eg:  "," , ":", "|||".
  name: delimiter
  supportedModules: []
comment: Set multiple keys/values to the context.
commonfields:
  id: bbb2bab8-a1fd-44bc-8b13-e367f572b358
  version: -1
dockerimage: demisto/python3:3.12.13.8428455
enabled: true
engineinfo: {}
mainengineinfo: {}
name: SetMultipleValuesV2
pswd: ""
restrictioncenter: {}
runas: DBotWeakRole
runonce: false
script: |-
  register_module_line('SetMultipleValuesV2', 'start', __line__())


  def main():
      delimiter = demisto.args().get("delimiter", ",")
      keys = [k.strip() for k in demisto.args()["keys"].split(delimiter)]
      values_str = demisto.args()["values"]

      # Removed the bracket-wrapping logic here
      values = argToList(values_str, separator=delimiter)

      ec = {demisto.args()["parent"] + "(true)": dict(zip(keys, values))}
      demisto.results(
          {
              "Type": entryTypes["note"],
              "Contents": ec,
              "ContentsFormat": formats["json"],
              "HumanReadable": "Keys " + ",".join(keys) + " set",
              "EntryContext": ec,
          }
      )

  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()

  register_module_line('SetMultipleValuesV2', 'end', __line__())
scripttarget: 0
signature: ""
subtype: python3
